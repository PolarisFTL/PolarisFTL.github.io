name: Validate homepage

on:
  push:
    branches: [main, feature/clover-bgm-player, feature/clover-visitor-counter]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
      - name: Build Jekyll with the existing lockfile
        run: bundle exec jekyll build --trace
      - uses: actions/upload-artifact@v4
        with:
          name: homepage-preview
          path: _site
          retention-days: 3
