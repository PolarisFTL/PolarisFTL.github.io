<dialog class="clover-music-consent" data-music-consent role="dialog" aria-modal="true" aria-labelledby="clover-music-consent-title" aria-describedby="clover-music-consent-description">
  <span class="clover-music-consent__clover" aria-hidden="true">♣</span>
  <p class="clover-music-consent__eyebrow">A little Clover magic</p>
  <h2 id="clover-music-consent-title">Welcome to Clover Mode</h2>
  <p id="clover-music-consent-description">Would you like to play background music?</p>
  <p class="clover-music-consent__track"><span lang="ja">消えない理由</span> <span aria-hidden="true">—</span> WANIMA</p>
  <div class="clover-music-consent__actions">
    <button class="clover-music-consent__allow" data-music-allow type="button"><i class="fas fa-play" aria-hidden="true"></i> Play BGM</button>
    <button class="clover-music-consent__deny" data-music-deny type="button" autofocus>Continue without music</button>
  </div>
  <p class="clover-music-consent__note">Your choice is remembered. You can always press Play later.</p>
</dialog>
