<script>
  (function () {
    var totalCitation = document.getElementById('total_cit');
    var publicationCitations = document.getElementsByClassName('show_paper_citations');
    if (!totalCitation && publicationCitations.length === 0) return;

    {% if site.google_scholar_stats_use_cdn %}
    var scholarDataUrl = 'https://cdn.jsdelivr.net/gh/{{ site.repository }}@google-scholar-stats/gs_data.json';
    {% else %}
    var scholarDataUrl = 'https://raw.githubusercontent.com/{{ site.repository }}/google-scholar-stats/gs_data.json';
    {% endif %}

    fetch(scholarDataUrl)
      .then(function (response) {
        if (!response.ok) throw new Error('Scholar statistics are unavailable.');
        return response.json();
      })
      .then(function (data) {
        if (totalCitation && typeof data.citedby !== 'undefined') {
          totalCitation.textContent = data.citedby;
        }

        Array.prototype.forEach.call(publicationCitations, function (element) {
          var paperId = element.getAttribute('data');
          var publication = data.publications && data.publications[paperId];
          if (publication && typeof publication.num_citations !== 'undefined') {
            element.textContent = '| Citations: ' + publication.num_citations;
          }
        });
      })
      .catch(function () {
        /* Citation labels stay hidden when the remote data branch is unavailable. */
      });
  })();
</script>
